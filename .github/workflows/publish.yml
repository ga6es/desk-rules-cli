name: Publish Desk Rules CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish as a dry run
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: desk-rules-cli-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @desk-rules/cli
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.12.1

      - name: Verify source export fingerprint
        run: npm run check:export

      - name: Install exact dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm test && npm run check:package

      - name: Inspect package tarball
        run: npm pack --dry-run --json --workspace @desk-rules/cli > npm-pack.json

      - name: Generate CycloneDX SBOM
        run: npm run sbom --silent > desk-rules-cli.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desk-rules-cli-release-evidence
          path: |
            npm-pack.json
            desk-rules-cli.cdx.json
          if-no-files-found: error

      - name: Publish package
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @desk-rules/cli --access public --provenance --dry-run
          else
            npm publish --workspace @desk-rules/cli --access public --provenance
          fi
